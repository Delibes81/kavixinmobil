<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nova.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Hestia | Encuentra tu hogar ideal</title>
    
    <link rel="preconnect" href="https://images.pexels.com">

    <meta name="theme-color" content="#0052a3">
    <link rel="apple-touch-icon" href="/nova.svg">
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">

    <!-- SEO: el plugin vite/seo-plugin.ts rellena este bloque por ruta en el build -->
    <!--seo:start-->
    <!--seo:end-->

    <!-- Critical inline CSS for above-the-fold content -->
    <style>
      /* Critical CSS for initial page load */
      body {
        margin: 0;
        font-family: Roboto, system-ui, sans-serif;
        background-color: #f5f7fa;
        color: #3f4552;
      }
      
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #001429, #003d7a, #0052a3);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #e6b325;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide content until React loads */
      #root:empty::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #001429, #003d7a, #0052a3);
        z-index: 9999;
      }
      
      #root:empty::after {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #e6b325;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        z-index: 10000;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
